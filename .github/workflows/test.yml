name: test

# changelog.py is 819 lines with a 439-line test suite beside it, and until now
# nothing ran it: build-image.yml was the repo's only workflow and it builds the
# container image without executing a single test. A suite CI never runs is not
# a safety net, it is a file.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches ruff.toml's target-version and the Fedora python3 the
          # Dockerfile installs.
          python-version: '3.11'

      - name: install test deps
        # No requirements file: changelog.py imports the standard library plus
        # zstandard (a system package in the Dockerfile), and the tests drive it
        # through subprocess and monkeypatch rather than importing that path.
        run: python -m pip install --upgrade pip pytest

      - name: pytest
        run: python -m pytest test_changelog.py -q
