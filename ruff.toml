# Lint config for changelog.py (819 lines) and test_changelog.py (439 lines) —
# this action is real, maintained Python, not a placeholder to satisfy a checker.
#
# Matches the org convention used in tunaOS, mandelbrot and suite-common:
# py311 (the Dockerfile installs Fedora's python3) at 100 columns.
target-version = "py311"
line-length = 100

# NOT yet wired into CI as a blocking gate. `ruff check` reports 7 remaining
# findings on this tree — 2 EXE001, 2 I001, and one each of F401, UP035, F841.
# All are mechanical (shebang bits, import order, unused names); 4 are
# auto-fixable. The exception-handling findings (TRY002, PLW1510 and the 6
# BLE001 blind-excepts) are gone: run_cmd now raises CommandError and the
# release path catches the RECOVERABLE tuple instead of bare Exception.
#
# Adding the job with `|| true` was considered and rejected: this org already
# learned that lesson the hard way (gtk-office-suite PR #86 shipped three
# launch-blocking bugs behind exactly that). Fix the findings, then gate.
